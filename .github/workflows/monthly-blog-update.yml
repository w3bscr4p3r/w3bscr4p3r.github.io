name: Monthly Blog Update

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil

      - name: Fetch previous month CISO Advisor data
        run: python .github/scripts/fetch_ciso_advisor.py

      - name: Generate blog HTML
        run: python .github/scripts/generate_blog.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet -- blog/index.html blog/data/ciso_advisor_latest.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add blog/index.html blog/data/ciso_advisor_latest.json
          git commit -m "chore: update blog for previous month"
          git push
