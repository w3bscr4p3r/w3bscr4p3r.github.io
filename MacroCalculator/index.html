<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Macro Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0b0f1a;
    --surface:   #111827;
    --surface2:  #1a2235;
    --border:    #1e2d45;
    --border-hi: #2a3f60;
    --cyan:      #00d4d8;
    --cyan-dim:  #00a8ab;
    --amber:     #f59e0b;
    --red:       #ef4444;
    --green:     #22c55e;
    --text:      #e2e8f0;
    --text-muted:#7f8ea3;
    --text-dim:  #4a5a70;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(0,212,216,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 100%, rgba(245,158,11,0.04) 0%, transparent 60%);
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }
  .logo-mark {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-dim) 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 700;
    color: var(--bg);
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 15px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .header-text p {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-dim);
    letter-spacing: .04em;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%; max-width: 760px;
    overflow: hidden;
  }
  .card-header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .card-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .card-header .dot.c { background: var(--cyan); }
  .card-header .dot.a { background: var(--amber); }
  .card-header .dot.r { background: var(--red); }
  .card-header span {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-muted);
    margin-left: 6px;
  }

  /* ── FORM ── */
  .form-body { padding: 28px; }

  .section-label {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 16px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px; font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .input-wrap { position: relative; }
  .input-wrap input, .input-wrap select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 42px 11px 14px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    appearance: none;
  }
  .input-wrap select { cursor: pointer; }
  .input-wrap input:focus, .input-wrap select:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,212,216,.12);
  }
  .input-wrap .unit {
    position: absolute; right: 13px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-dim);
    pointer-events: none;
  }

  /* Objetivo radios */
  .radio-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .radio-group input { display: none; }
  .radio-group label {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 8px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    text-align: center;
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .radio-group label .icon { font-size: 20px; margin-bottom: 2px; }
  .radio-group input:checked + label {
    border-color: var(--cyan);
    background: rgba(0,212,216,.07);
    color: var(--cyan);
  }
  .radio-group label:hover {
    border-color: var(--border-hi);
    color: var(--text);
  }

  /* Btn */
  .btn-calc {
    width: 100%;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-dim) 100%);
    border: none;
    border-radius: 9px;
    padding: 15px;
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 15px; font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
  }
  .btn-calc:hover { opacity: .9; transform: translateY(-1px); }
  .btn-calc:active { transform: translateY(0); }

  /* ── RESULTS ── */
  #results { display: none; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 28px;
  }
  .results-body { padding: 28px; }

  /* IMC */
  .imc-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .imc-left { display: flex; flex-direction: column; gap: 2px; }
  .imc-title {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .1em;
  }
  .imc-value {
    font-family: var(--font-mono);
    font-size: 32px; font-weight: 700;
    line-height: 1;
  }
  .imc-class {
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
  }
  .imc-bar-wrap {
    flex: 1; min-width: 180px;
  }
  .imc-scale {
    position: relative;
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(to right,
      #3b82f6 0% 14%,
      #22c55e 14% 38%,
      #f59e0b 38% 52%,
      #ef4444 52% 68%,
      #7c3aed 68% 100%);
    margin-bottom: 6px;
    overflow: visible;
  }
  .imc-cursor {
    position: absolute;
    top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 14px;
    background: var(--text);
    border-radius: 50%;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 2px var(--cyan);
    transition: left .5s cubic-bezier(.34,1.56,.64,1);
  }
  .imc-labels {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 9px; color: var(--text-dim);
  }

  /* Calorias totais */
  .kcal-block {
    display: flex; align-items: baseline; gap: 6px;
    margin-bottom: 6px;
  }
  .kcal-num {
    font-family: var(--font-mono);
    font-size: 42px; font-weight: 700;
    color: var(--cyan);
    line-height: 1;
  }
  .kcal-unit {
    font-family: var(--font-mono);
    font-size: 13px; color: var(--text-muted);
  }
  .kcal-sub {
    font-size: 12px; color: var(--text-dim);
    margin-bottom: 24px;
  }

  /* Macros */
  .macros-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .macro-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    position: relative; overflow: hidden;
  }
  .macro-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .macro-card.protein::before { background: var(--cyan); }
  .macro-card.carbs::before   { background: var(--amber); }
  .macro-card.fat::before     { background: var(--red); }

  .macro-label {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--text-dim);
  }
  .macro-label.protein { color: var(--cyan); }
  .macro-label.carbs   { color: var(--amber); }
  .macro-label.fat     { color: var(--red); }

  .macro-grams {
    font-family: var(--font-mono);
    font-size: 26px; font-weight: 700;
    line-height: 1;
  }
  .macro-grams span { font-size: 13px; font-weight: 400; color: var(--text-muted); }

  .macro-kcal {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-muted);
  }

  .macro-bar-bg {
    height: 4px; border-radius: 99px;
    background: var(--border);
    overflow: hidden;
  }
  .macro-bar-fill {
    height: 100%; border-radius: 99px;
    transition: width .6s cubic-bezier(.34,1.56,.64,1);
  }
  .protein .macro-bar-fill { background: var(--cyan); }
  .carbs   .macro-bar-fill { background: var(--amber); }
  .fat     .macro-bar-fill { background: var(--red); }

  /* Refeições */
  .meal-section-label {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .meals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .meal-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .meal-name {
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 4px;
  }
  .meal-kcal {
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 700;
    color: var(--text);
  }
  .meal-kcal span { font-size: 11px; font-weight: 400; color: var(--text-dim); }
  .meal-macros {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-dim);
    margin-top: 4px;
  }

  /* Dicas */
  .tips-row {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .tip-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,212,216,.06);
    border: 1px solid rgba(0,212,216,.15);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px; color: var(--text-muted);
  }
  .tip-badge .t-icon { font-size: 14px; }

  /* Responsive */
  @media (max-width: 540px) {
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .radio-group { grid-template-columns: 1fr; }
    .macros-grid { grid-template-columns: 1fr; }
    .kcal-num { font-size: 32px; }
    .imc-value { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">Σ</div>
  <div class="header-text">
    <h1>Macro Calculator</h1>
    <p>Versão v1.0 // Daniel M. Alves</p>
  </div>
</header>

<div class="card">
  <!-- form header -->
  <div class="card-header">
    <div class="dot c"></div>
    <div class="dot a"></div>
    <div class="dot r"></div>
  </div>

  <div class="form-body">
    <!-- Dados pessoais -->
    <p class="section-label">// Dados Pessoais</p>
    <div class="grid-3">
      <div class="field">
        <label>Peso</label>
        <div class="input-wrap">
          <input type="number" id="peso" placeholder="75" min="30" max="300" />
          <span class="unit">kg</span>
        </div>
      </div>
      <div class="field">
        <label>Altura</label>
        <div class="input-wrap">
          <input type="number" id="altura" placeholder="175" min="100" max="250" />
          <span class="unit">cm</span>
        </div>
      </div>
      <div class="field">
        <label>Idade</label>
        <div class="input-wrap">
          <input type="number" id="idade" placeholder="30" min="10" max="100" />
          <span class="unit">anos</span>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Sexo biológico</label>
        <div class="input-wrap">
          <select id="sexo">
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
          <span class="unit">▾</span>
        </div>
      </div>
      <div class="field">
        <label>Nível de atividade</label>
        <div class="input-wrap">
          <select id="atividade">
            <option value="1.2">Sedentário — pouca/sem exercício</option>
            <option value="1.375">Leve — 1–3x/semana</option>
            <option value="1.55" selected>Moderado — 3–5x/semana</option>
            <option value="1.725">Intenso — 6–7x/semana</option>
            <option value="1.9">Muito intenso — 2x/dia</option>
          </select>
          <span class="unit">▾</span>
        </div>
      </div>
    </div>

    <!-- Objetivo -->
    <p class="section-label" style="margin-top:4px;">// Objetivo</p>
    <div class="radio-group">
      <input type="radio" name="objetivo" id="perda" value="perda" />
      <label for="perda"><span class="icon">🔥</span>Perda de peso</label>

      <input type="radio" name="objetivo" id="manutencao" value="manutencao" checked />
      <label for="manutencao"><span class="icon">⚖️</span>Manutenção</label>

      <input type="radio" name="objetivo" id="ganho" value="ganho" />
      <label for="ganho"><span class="icon">💪</span>Ganho de massa</label>
    </div>

    <button class="btn-calc" onclick="calcular()">Calcular Macros →</button>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="divider"></div>

    <div class="results-body">
      <p class="section-label">// Resultado</p>

      <!-- IMC -->
      <div class="imc-row">
        <div class="imc-left">
          <span class="imc-title">IMC</span>
          <span class="imc-value" id="imc-val">—</span>
          <span class="imc-class" id="imc-class">—</span>
        </div>
        <div class="imc-bar-wrap">
          <div class="imc-scale">
            <div class="imc-cursor" id="imc-cursor" style="left:0%"></div>
          </div>
          <div class="imc-labels">
            <span>Baixo &lt;18.5</span>
            <span>Normal</span>
            <span>Sobrepeso</span>
            <span>Obeso &gt;30</span>
          </div>
        </div>
      </div>

      <!-- Calorias -->
      <div class="kcal-block">
        <span class="kcal-num" id="kcal-total">0</span>
        <span class="kcal-unit">kcal / dia</span>
      </div>
      <p class="kcal-sub" id="kcal-sub">—</p>

      <!-- Macros -->
      <div class="macros-grid">
        <div class="macro-card protein">
          <span class="macro-label protein">Proteína</span>
          <div class="macro-grams"><span id="p-g">0</span><span>&nbsp;g</span></div>
          <div class="macro-kcal" id="p-kcal">0 kcal · 0%</div>
          <div class="macro-bar-bg"><div class="macro-bar-fill" id="p-bar" style="width:0%"></div></div>
        </div>
        <div class="macro-card carbs">
          <span class="macro-label carbs">Carboidratos</span>
          <div class="macro-grams"><span id="c-g">0</span><span>&nbsp;g</span></div>
          <div class="macro-kcal" id="c-kcal">0 kcal · 0%</div>
          <div class="macro-bar-bg"><div class="macro-bar-fill" id="c-bar" style="width:0%"></div></div>
        </div>
        <div class="macro-card fat">
          <span class="macro-label fat">Gorduras</span>
          <div class="macro-grams"><span id="f-g">0</span><span>&nbsp;g</span></div>
          <div class="macro-kcal" id="f-kcal">0 kcal · 0%</div>
          <div class="macro-bar-bg"><div class="macro-bar-fill" id="f-bar" style="width:0%"></div></div>
        </div>
      </div>

      <!-- Distribuição por refeição -->
      <p class="meal-section-label">// Distribuição por refeição (5x/dia)</p>
      <div class="meals-grid" id="meals-grid"></div>

      <!-- Dicas -->
      <div class="tips-row" id="tips-row"></div>
    </div>
  </div>
</div>

<script>
const IMC_RANGES = [
  { max: 18.5, label: 'Abaixo do peso',  color: '#3b82f6', pct: 8 },
  { max: 25,   label: 'Peso normal',     color: '#22c55e', pct: 26 },
  { max: 30,   label: 'Sobrepeso',       color: '#f59e0b', pct: 45 },
  { max: 35,   label: 'Obesidade I',     color: '#ef4444', pct: 60 },
  { max: 40,   label: 'Obesidade II',    color: '#dc2626', pct: 75 },
  { max: Infinity, label: 'Obesidade III', color: '#7c3aed', pct: 90 },
];

const MEAL_NAMES = ['Café da manhã','Lanche 1','Almoço','Lanche 2','Jantar'];
const MEAL_PCT   = [0.25, 0.10, 0.30, 0.10, 0.25];

const TIPS = {
  perda: [
    { icon:'💧', txt:'Hidratação: 35–40 ml/kg de água/dia' },
    { icon:'🥗', txt:'Priorize vegetais de baixa caloria para volume' },
    { icon:'⏰', txt:'Déficit gradual: -300 a -500 kcal/dia é seguro' },
  ],
  manutencao: [
    { icon:'💧', txt:'Hidratação: 35 ml/kg de água/dia' },
    { icon:'🍽️', txt:'Mantenha horários regulares de refeição' },
    { icon:'📊', txt:'Ajuste a cada 4 semanas conforme balanço' },
  ],
  ganho: [
    { icon:'💧', txt:'Hidratação: 40 ml/kg + extra pós-treino' },
    { icon:'🥩', txt:'Proteína ao redor do treino é prioridade' },
    { icon:'📈', txt:'Superávit gradual: +250 a +500 kcal/dia' },
  ],
};

function calcular() {
  const peso    = +document.getElementById('peso').value;
  const altura  = +document.getElementById('altura').value;
  const idade   = +document.getElementById('idade').value;
  const sexo    = document.getElementById('sexo').value;
  const ativ    = +document.getElementById('atividade').value;
  const objetivo = document.querySelector('input[name="objetivo"]:checked').value;

  if (!peso || !altura || !idade || peso < 30 || altura < 100 || idade < 10) {
    alert('Por favor, preencha todos os campos corretamente.');
    return;
  }

  // IMC
  const altM = altura / 100;
  const imc  = peso / (altM * altM);
  const imcRange = IMC_RANGES.find(r => imc < r.max);

  // TMB (Mifflin-St Jeor)
  let tmb;
  if (sexo === 'M') tmb = 10 * peso + 6.25 * altura - 5 * idade + 5;
  else              tmb = 10 * peso + 6.25 * altura - 5 * idade - 161;

  let tdee = tmb * ativ;

  // Ajuste por objetivo
  let ajuste = 0;
  if (objetivo === 'perda') ajuste = -400;
  if (objetivo === 'ganho') ajuste = 350;
  const kcalAlvo = Math.round(tdee + ajuste);

  // Macros (g/kg)
  let pGkg = objetivo === 'ganho' ? 2.2 : objetivo === 'perda' ? 2.0 : 1.8;
  const pG  = Math.round(pGkg * peso);
  const pKcal = pG * 4;

  // Gordura: ~25–30% kcal
  const fKcal = Math.round(kcalAlvo * (objetivo === 'perda' ? 0.25 : 0.28));
  const fG    = Math.round(fKcal / 9);

  // Carbo: restante
  const cKcal = kcalAlvo - pKcal - fKcal;
  const cG    = Math.round(cKcal / 4);

  const total = pKcal + fKcal + cKcal;

  // Render IMC
  document.getElementById('imc-val').textContent   = imc.toFixed(1);
  document.getElementById('imc-class').textContent  = imcRange.label;
  document.getElementById('imc-val').style.color    = imcRange.color;
  setTimeout(() => {
    document.getElementById('imc-cursor').style.left = imcRange.pct + '%';
  }, 80);

  // Render kcal
  document.getElementById('kcal-total').textContent = kcalAlvo.toLocaleString('pt-BR');
  const objTxt = objetivo === 'perda' ? 'perda de peso (-400 kcal de TDEE)' :
                 objetivo === 'ganho' ? 'ganho de massa (+350 kcal de TDEE)' :
                 'manutenção do peso atual';
  document.getElementById('kcal-sub').textContent =
    `TMB: ${Math.round(tmb)} kcal · TDEE: ${Math.round(tdee)} kcal · Objetivo: ${objTxt}`;

  // Render macros
  const setMacro = (prefix, g, kcal) => {
    document.getElementById(`${prefix}-g`).textContent    = g;
    document.getElementById(`${prefix}-kcal`).textContent =
      `${kcal} kcal · ${Math.round(kcal/total*100)}%`;
    setTimeout(() => {
      document.getElementById(`${prefix}-bar`).style.width =
        Math.round(kcal / total * 100) + '%';
    }, 100);
  };
  setMacro('p', pG,  pKcal);
  setMacro('c', cG,  cKcal);
  setMacro('f', fG,  fKcal);

  // Refeições
  const mealsGrid = document.getElementById('meals-grid');
  mealsGrid.innerHTML = MEAL_NAMES.map((name, i) => {
    const mk = Math.round(kcalAlvo * MEAL_PCT[i]);
    const mp = Math.round(pG * MEAL_PCT[i]);
    const mc = Math.round(cG * MEAL_PCT[i]);
    const mf = Math.round(fG * MEAL_PCT[i]);
    return `
      <div class="meal-card">
        <div class="meal-name">${name}</div>
        <div class="meal-kcal">${mk}<span> kcal</span></div>
        <div class="meal-macros">P ${mp}g · C ${mc}g · G ${mf}g</div>
      </div>`;
  }).join('');

  // Dicas
  const tipsRow = document.getElementById('tips-row');
  tipsRow.innerHTML = TIPS[objetivo].map(t =>
    `<div class="tip-badge"><span class="t-icon">${t.icon}</span>${t.txt}</div>`
  ).join('');

  // Show results
  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  setTimeout(() => resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

// Enter para calcular
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') calcular();
});
</script>
</body>
</html>
